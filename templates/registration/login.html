{% extends 'base.html' %}

{% block title %}Login - CommitBuddy{% endblock %}

{% block content %}
<div class="row justify-content-center fade-in">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card">
            <h2 class="text-center mb-4 fw-bold">Welcome Back</h2>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-premium w-100">Login</button>
            </form>
            <p class="text-center mt-4 mb-0">
                Don't have an account? <a href="/users/register/" class="text-primary text-decoration-none">Join
                    here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
    input {
        background: rgba(255, 255, 255, 0.05) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        color: white !important;
        padding: 0.75rem !important;
    }

    input:focus {
        border-color: var(--primary-color) !important;
        box-shadow: 0 0 0 0.25rem rgba(0, 210, 255, 0.25) !important;
    }
</style>
{% endblock %}
